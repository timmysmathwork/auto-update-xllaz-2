<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto-updating site</title>
<style>
html,body{height:100%;margin:0;background:#07120c;color:#effff2;font:16px Arial,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07120c}#status{position:fixed;z-index:10;bottom:16px;right:16px;max-width:360px;padding:14px 18px;border:1px solid #34734a;border-radius:12px;background:#12351f;box-shadow:0 8px 30px #0006}#status[hidden]{display:none}button{margin-top:10px;padding:8px 14px;background:#55c878;color:#07120c;border:0;border-radius:6px;cursor:pointer}p{margin:6px 0;line-height:1.4}
</style>
</head>
<body>
<iframe id="site" title="Website" allow="clipboard-read; clipboard-write; fullscreen; autoplay; camera; microphone; display-capture" allowfullscreen></iframe>
<div id="status" role="status" aria-live="polite"><p id="message">Loading the latest website from GitHub…</p><button id="retry" hidden>Retry now</button></div>
<script>
'use strict';
const SOURCE = "https://raw.githubusercontent.com/roccohebert687-cloud/Real-Auto-update/main/updated-site.html";
const frame = document.getElementById('site');
const statusBox = document.getElementById('status');
const message = document.getElementById('message');
const retry = document.getElementById('retry');
let previous = null;
let busy = false;
let hideTimer;
function status(text, error = false) {
  clearTimeout(hideTimer);
  message.textContent = text;
  retry.hidden = !error;
  statusBox.hidden = false;
  if (!error && previous !== null) hideTimer = setTimeout(() => statusBox.hidden = true, 3500);
}
async function checkForUpdate() {
  if (busy) return;
  busy = true;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);
  try {
    const response = await fetch(SOURCE + '?auto_update=' + Date.now(), {
      cache: 'no-store', credentials: 'omit', signal: controller.signal
    });
    if (!response.ok) throw new Error('GitHub returned HTTP ' + response.status);
    const html = await response.text();
    if (!/<(?:!doctype\s+html|html|body)(?:\s|>)/i.test(html)) throw new Error('The source did not return an HTML page');
    if (html !== previous) {
      const updating = previous !== null;
      previous = html;
      frame.srcdoc = html;
      status(updating ? 'Website updated to the latest GitHub version.' : 'Latest website loaded.');
    } else {
      statusBox.hidden = true;
    }
  } catch (error) {
    const detail = error.name === 'AbortError' ? 'The request timed out.' : error.message;
    status((previous === null ? 'Could not load the website. ' : 'Update check failed; keeping the current page open. ') + detail + ' Make sure the repository and file are public. Retrying every 60 seconds.', true);
  } finally {
    clearTimeout(timeout);
    busy = false;
  }
}
retry.addEventListener('click', checkForUpdate);
window.addEventListener('online', checkForUpdate);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkForUpdate();
});
checkForUpdate();
setInterval(() => { if (!document.hidden) checkForUpdate(); }, 60000);
</script>
</body>
</html>
